<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL BYPASS | Dashboard de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #161b22;
            --accent: #00ff41;
            --accent-red: #ff3e3e;
            --text-main: #e6edf3;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', sans-serif; }
        .glass { background: var(--card-bg); border: 1px solid #30363d; }
        .btn-primary { background: var(--accent); color: black; font-weight: bold; transition: 0.3s; }
        .btn-primary:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--accent); }
        #console { background: #000; color: #00ff41; font-family: 'Courier New', monospace; height: 200px; overflow-y: auto; }
    </style>
</head>
<body class="p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-[#00ff41] tracking-widest uppercase">KL BYPASS ENGINE</h1>
            <p class="text-gray-400 mt-2">Gerador de Payload com Ofuscação de Alta Camuflagem</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Coluna 1: Upload -->
            <div class="glass p-6 rounded-xl">
                <h2 class="text-xl font-semibold mb-4"><i class="fas fa-upload mr-2"></i> Upload do APK</h2>
                <div id="drop-zone" class="border-2 border-dashed border-gray-600 rounded-lg p-10 text-center cursor-pointer hover:border-[#00ff41] transition-all">
                    <i class="fas fa-file-code text-4xl text-gray-500 mb-4"></i>
                    <p id="file-name" class="text-sm text-gray-400">Arraste o APK ou clique aqui</p>
                    <input type="file" id="apk-file" class="hidden" accept=".apk">
                </div>
                <button id="btn-process" class="btn-primary w-full mt-6 py-3 rounded-lg uppercase">Iniciar Processamento</button>
                
                <div id="status-area" class="mt-6 text-center hidden">
                    <div class="animate-spin inline-block w-6 h-6 border-4 border-t-transparent border-[#00ff41] rounded-full mb-2"></div>
                    <p id="status-text" class="text-sm text-[#00ff41]">Processando Bypass...</p>
                </div>

                <div id="result-area" class="mt-6 hidden">
                    <h3 class="text-green-400 font-bold mb-2 text-center">✅ Bypass Aplicado!</h3>
                    <a id="download-btn" href="#" class="block text-center bg-blue-600 text-white py-2 rounded mt-2 hover:bg-blue-700 transition-all">Baixar APK Processado</a>
                </div>
            </div>

            <!-- Coluna 2: Console -->
            <div class="glass p-6 rounded-xl">
                <h2 class="text-xl font-semibold mb-4"><i class="fas fa-terminal mr-2"></i> Console de Sistema</h2>
                <div id="console" class="p-4 rounded-md text-xs overflow-y-auto h-48">
                    <div class="text-gray-500">[SISTEMA] Aguardando comando...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('apk-file');
        const dropZone = document.getElementById('drop-zone');
        const fileNameText = document.getElementById('file-name');
        const btnProcess = document.getElementById('btn-process');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const consoleDiv = document.getElementById('console');
        const resultArea = document.getElementById('result-area');
        const downloadBtn = document.getElementById('download-btn');

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff3e3e' : (type === 'success' ? '#00ff41' : '#8b949e');
            const entry = document.createElement('div');
            entry.className = 'mb-2';
            entry.innerHTML = `<span class="text-gray-500">[${time}]</span> <span style="color: ${color}">${msg}</span>`;
            consoleDiv.prepend(entry);
        }

        dropZone.onclick = () => fileInput.click();

        fileInput.onchange = () => {
            if(fileInput.files.length > 0) {
                fileNameText.innerText = fileInput.files[0].name;
                fileNameText.classList.add('text-[#00ff41]');
                addLog(`Arquivo selecionado: ${fileInput.files[0].name}`, 'info');
            }
        };

        btnProcess.onclick = async () => {
            if (fileInput.files.length === 0) {
                alert("Selecione um arquivo APK primeiro!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            btnProcess.disabled = true;
            btnProcess.classList.add('opacity-50');
            statusArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            addLog(`Iniciando upload: ${file.name}`, 'info');

            try {
                const response = await fetch('/api/v1/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.status !== 'success') throw new Error(data.message);

                addLog(`Upload concluído. Iniciando Bypass...`, 'info');

                // Simulação de delay do processo
                setTimeout(() => {
                    addLog(`Aplicando Ofuscação...`, 'info');
                    addLog(`Injetando Módulo de Evasão...`, 'info');
                    addLog(`Gerando Assinatura Digital...`, 'info');
                    addLog(`Bypass concluído com sucesso!`, 'success');

                    resultArea.classList.remove('hidden');
                    downloadBtn.href = data.download_url;
                    
                    statusArea.classList.add('hidden');
                    btnProcess.disabled = false;
                    btnProcess.classList.remove('opacity-50');
                }, 5000);

            } catch (error) {
                addLog(`ERRO: ${error.message}`, 'error');
                statusArea.classList.add('hidden');
                btnProcess.disabled = false;
                btnProcess.classList.remove('opacity-50');
            }
        };
    </script>
</body>
</html>
